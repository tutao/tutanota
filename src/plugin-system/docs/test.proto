syntax = "proto3";

package plugin.v1;

message Empty {}

message PluginInfo {
  string id = 1;
  string name = 2;
  string version = 3;
}

message ExecuteRequest {
  string command = 1;
  bytes payload = 2;
}

message ExecuteResponse {
  bool success = 1;
  bytes payload = 2;
  string error = 3;
}

service Plugin {
  rpc GetInfo(Empty) returns (PluginInfo);
  rpc Initialize(Empty) returns (Empty);
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
  rpc Shutdown(Empty) returns (Empty);
}
