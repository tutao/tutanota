version: v2

managed:
  enabled: true

plugins:
  - remote: buf.build/bufbuild/es:v2.13.0
    out: gen
    opt: target=ts
  - local: [ "npx", "tsx", "protoc-plugins/protoc-gen-capnweb.ts" ]
    out: gen
    opt:
      - target=ts
      - import_extension=.js

inputs:
  - directory: .
    paths:
      - proto
